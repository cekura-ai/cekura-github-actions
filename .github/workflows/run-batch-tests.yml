name: run-batch tests

on:
  pull_request:
    paths: ['run-batch/**', '.github/workflows/run-batch-tests.yml']
  push:
    branches: [main]
    paths: ['run-batch/**', '.github/workflows/run-batch-tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: python -m unittest discover -s run-batch/tests -v
