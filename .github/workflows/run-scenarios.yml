name: Run Scenarios

# Supports multiple trigger types:
# 1. Manual trigger (workflow_dispatch) - Run from GitHub Actions UI with custom inputs
# 2. Automatic on PR (pull_request) - Runs on PR open/update
# 3. Label-based (labeled) - Add 'run-scenarios' label to trigger

on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: 'Agent ID'
        required: true
      scenarios:
        description: 'Comma-separated list of scenario IDs'
        required: true
      frequency:
        description: 'Number of times to run each scenario'
        required: false
        default: '1'
      timeout:
        description: 'Timeout in seconds'
        required: false
        default: '3600'

  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

jobs:
  run-scenarios:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scenarios
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_KEY: ${{ secrets.API_KEY }}
        AGENT_ID: ${{ github.event.inputs.agent_id || secrets.AGENT_ID }}
        SCENARIOS: ${{ github.event.inputs.scenarios || secrets.SCENARIOS }}
        FREQUENCY: ${{ github.event.inputs.frequency || '1' }}
        TIMEOUT: ${{ github.event.inputs.timeout || '3600' }}
      run: python run_scenarios.py 