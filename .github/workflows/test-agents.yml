name: Agent Tests

on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: 'The agent identifier'
        required: false
        type: string
      scenario_ids:
        description: 'Comma-separated scenario IDs (e.g., "123,456,789")'
        required: false
        type: string
      timeout:
        description: 'Action polling timeout in seconds'
        required: false
        default: '10'
        type: string

jobs:
  run-simulation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cekura Run Tests
        id: run-tests
        continue-on-error: true
        # The disposable validation branch uses the checked-out Action source.
        uses: ./
        with:
          agent_id: ${{ inputs.agent_id || vars.AGENT_ID }}
          scenario_ids: ${{ inputs.scenario_ids || '11924' }}
          timeout: ${{ inputs.timeout }}
          api_key: ${{ secrets.CEKURA_API_KEY }}

      - name: Verify timeout result output
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.run-tests.outcome }}
          RESULT_ID: ${{ steps.run-tests.outputs.result_id }}
          RESULT_URL: ${{ steps.run-tests.outputs.result_url }}
        run: |
          test "$ACTION_OUTCOME" = "failure"
          test -n "$RESULT_ID"
          test -n "$RESULT_URL"
          echo "Cekura result ID: $RESULT_ID"
          echo "Cekura result URL: $RESULT_URL"
