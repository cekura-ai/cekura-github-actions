name: "Cekura Run Tests"
description: "Run Cekura test scenarios against your agents"
author: "Cekura AI"

inputs:
  agent_id:
    description: 'Agent ID to test'
    required: true
  scenario_ids:
    description: 'Comma-separated scenario IDs (e.g., 123,456,789)'
    required: false
  tags:
    description: 'Comma-separated tags (e.g., smoke-test,critical)'
    required: false
  execution_mode:
    description: 'How to run the scenarios: voice, text, livekit_v2, or pipecat_v2'
    required: false
    default: 'voice'
  livekit_data:
    description: 'Optional JSON overrides for LiveKit runs: agent_name, url, and config'
    required: false
  pipecat_data:
    description: 'Optional JSON overrides for Pipecat runs: pipecat_agent_name, config, and room_properties'
    required: false
  websocket_url:
    description: 'Optional websocket URL for text runs (overrides the agent''s saved websocket URL)'
    required: false
  phone_number:
    description: 'Outbound phone number for testing'
    required: false
  name:
    description: 'Name/label for this test run'
    required: false
  api_url:
    description: 'Cekura API URL'
    required: false
    default: 'https://api.cekura.ai'
  frequency:
    description: 'Number of times to run each scenario'
    required: false
    default: '1'
  timeout:
    description: 'Timeout in seconds'
    required: false
    default: '3600'
  api_key:
    description: 'Cekura API Key'
    required: true

outputs:
  result_url:
    description: 'Shareable URL to view test results'
    value: ${{ steps.run-tests.outputs.result_url }}
  result_id:
    description: 'Test result ID'
    value: ${{ steps.run-tests.outputs.result_id }}

runs:
  using: "composite"
  steps:
    - name: Run Cekura Tests
      id: run-tests
      shell: bash
      env:
        API_URL: ${{ inputs.api_url }}
        API_KEY: ${{ inputs.api_key }}
        AGENT_ID: ${{ inputs.agent_id }}
        SCENARIO_IDS: ${{ inputs.scenario_ids }}
        TAGS: ${{ inputs.tags }}
        EXECUTION_MODE: ${{ inputs.execution_mode }}
        LIVEKIT_DATA: ${{ inputs.livekit_data }}
        PIPECAT_DATA: ${{ inputs.pipecat_data }}
        WEBSOCKET_URL: ${{ inputs.websocket_url }}
        PHONE_NUMBER: ${{ inputs.phone_number }}
        NAME: ${{ inputs.name }}
        FREQUENCY: ${{ inputs.frequency }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -e

        # GitHub cancels a step (workflow cancel or job timeout-minutes) by
        # sending SIGINT to this shell only, then SIGTERM 7.5s later and
        # SIGKILL 2.5s after that. Bash defers traps until a foreground child
        # exits, so every wait below must stay short or be interruptible.
        RESULT_ID=""
        RESULT_IS_TERMINAL=false
        UNFINISHED_REPORTED=false
        RESULT_LINK_PUBLISHED=false
        BACKGROUND_PID=""

        # Run a command in the background and `wait` for it: `wait` returns as
        # soon as a trapped signal arrives, whereas a foreground command would
        # hold the cancellation trap until it finished. Returns its exit code.
        run_interruptible() {
          local exit_code=0
          "$@" &
          BACKGROUND_PID=$!
          wait "$BACKGROUND_PID" || exit_code=$?
          BACKGROUND_PID=""
          return $exit_code
        }

        cleanup_cekura_result() {
          echo "Requesting Cekura to end active runs for result $RESULT_ID..."

          set +e
          CLEANUP_RESPONSE=$(curl --connect-timeout 3 --max-time 5 -sS -w "\n%{http_code}" -X POST \
            "${API_URL}/test_framework/v1/results/${RESULT_ID}/end_calls/" \
            -H "X-CEKURA-API-KEY: ${API_KEY}")
          CLEANUP_CURL_EXIT_CODE=$?
          set -e

          if [ $CLEANUP_CURL_EXIT_CODE -ne 0 ]; then
            echo "Warning: Could not request Cekura cleanup (curl exit code: $CLEANUP_CURL_EXIT_CODE)"
            CLEANUP_OUTCOME="Could not reach Cekura to end active runs (curl exit code: $CLEANUP_CURL_EXIT_CODE); end them from the dashboard."
            return 0
          fi

          CLEANUP_HTTP_CODE=$(echo "$CLEANUP_RESPONSE" | tail -n1)
          case "$CLEANUP_HTTP_CODE" in
            200|201|202|204)
              echo "Cekura cleanup request accepted."
              CLEANUP_OUTCOME="Requested Cekura to end active runs."
              ;;
            *)
              echo "Warning: Cekura cleanup returned HTTP $CLEANUP_HTTP_CODE"
              CLEANUP_OUTCOME="Cekura returned HTTP $CLEANUP_HTTP_CODE when asked to end active runs; end them from the dashboard."
              ;;
          esac
        }

        # $1 = curl --max-time for the request, kept short on cancellation.
        publish_result_link() {
          if [ -z "$RESULT_ID" ] || [ "$RESULT_LINK_PUBLISHED" = true ]; then
            return 0
          fi

          RESULT_LINK_PUBLISHED=true
          echo "Generating shareable link..."
          EXPIRE_AT=$(date -u -d "+7 days" +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u -v+7d +"%Y-%m-%dT%H:%M:%SZ")
          SHAREABLE_PAYLOAD="{\"expire_at\":\"${EXPIRE_AT}\"}"

          set +e
          SHAREABLE_RESPONSE=$(curl --connect-timeout "$1" --max-time "$1" -sS -w "\n%{http_code}" -X POST \
            "${API_URL}/test_framework/v1/results/${RESULT_ID}/create_shareable_link_token/" \
            -H "X-CEKURA-API-KEY: ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d "${SHAREABLE_PAYLOAD}")
          SHAREABLE_CURL_EXIT_CODE=$?
          set -e

          if [ $SHAREABLE_CURL_EXIT_CODE -ne 0 ]; then
            echo "Warning: Could not generate shareable link (curl exit code: $SHAREABLE_CURL_EXIT_CODE)"
            return 0
          fi

          SHAREABLE_HTTP_CODE=$(echo "$SHAREABLE_RESPONSE" | tail -n1)
          SHAREABLE_BODY=$(echo "$SHAREABLE_RESPONSE" | sed '$d')
          if [ "$SHAREABLE_HTTP_CODE" != "200" ] && [ "$SHAREABLE_HTTP_CODE" != "201" ]; then
            echo "Warning: Failed to generate shareable link (HTTP $SHAREABLE_HTTP_CODE)"
            return 0
          fi

          RESULT_URL=$(echo "$SHAREABLE_BODY" | python3 -c "import sys, json; data = json.load(sys.stdin); print(data.get('shareable_link', ''))" 2>/dev/null) || RESULT_URL=""
          if [ -z "$RESULT_URL" ]; then
            echo "Warning: Could not extract shareable link from response"
            return 0
          fi

          echo "result_url=${RESULT_URL}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "📊 View Results: $RESULT_URL"
          echo ""
          echo "[📊 View Full Results]($RESULT_URL)" >> "$GITHUB_STEP_SUMMARY"
        }

        # Summarise a result the action stopped watching before it finished.
        # $1 = summary headline, $2 = true to end the active Cekura runs,
        # $3 = shareable-link request timeout in seconds.
        report_unfinished_result() {
          if [ -z "$RESULT_ID" ] || [ "$RESULT_IS_TERMINAL" = true ] || [ "$UNFINISHED_REPORTED" = true ]; then
            return 0
          fi
          UNFINISHED_REPORTED=true

          # Write the result ID before any network call so it survives a kill.
          {
            echo "## Test Results"
            echo ""
            echo "$1"
            echo ""
            echo "- Result ID: $RESULT_ID"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$2" = true ]; then
            cleanup_cekura_result
            echo "- $CLEANUP_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Cekura runs were left running; open the results to see how they finish." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          publish_result_link "$3"
        }

        handle_cancellation() {
          local signal="$1"
          if [ -n "$BACKGROUND_PID" ]; then
            kill "$BACKGROUND_PID" 2>/dev/null || true
          fi

          # A signal that arrives during the create request is handled right
          # after curl returns, before RESULT_ID is parsed: recover it here.
          if [ -z "$RESULT_ID" ] && [ -n "${RESPONSE:-}" ]; then
            case "$(echo "$RESPONSE" | tail -n1)" in
              200|201)
                RESULT_ID=$(echo "$RESPONSE" | sed '$d' | python3 -c "import sys, json; print(json.load(sys.stdin).get('id', ''))" 2>/dev/null) || RESULT_ID=""
                ;;
            esac
            if [ -n "$RESULT_ID" ]; then
              echo "result_id=${RESULT_ID}" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo ""
          echo "Workflow cancellation received ($signal). Ending active Cekura runs..."
          # end_calls (<=5s) + shareable link (<=2s) fit inside the 7.5s SIGINT grace.
          report_unfinished_result "⚠️ Workflow Cancelled Before Tests Finished" true 2
          trap - EXIT INT TERM
          if [ "$signal" = "INT" ]; then
            exit 130
          fi
          exit 143
        }

        # Any other early exit after the result exists (e.g. the status
        # endpoint keeps failing) still reports the result, but leaves the
        # runs alone: they finish normally and stay visible in Cekura.
        trap 'report_unfinished_result "❌ Stopped Monitoring Before Tests Finished" false 15' EXIT
        trap 'handle_cancellation INT' INT
        trap 'handle_cancellation TERM' TERM

        echo "=========================================="
        echo "Cekura Test Framework"
        echo "=========================================="
        echo ""
        echo "Configuration:"
        echo "  Agent ID: $AGENT_ID"
        echo "  API URL: $API_URL"
        echo ""

        if [ -n "$WEBSOCKET_URL" ] && [ "$EXECUTION_MODE" != "text" ]; then
          echo "Error: websocket_url is only valid for text runs."
          exit 1
        fi

        case "$EXECUTION_MODE" in
          voice|text)
            if [ -n "$LIVEKIT_DATA" ] || [ -n "$PIPECAT_DATA" ]; then
              echo "Error: provider data is only valid for livekit_v2 or pipecat_v2 runs."
              exit 1
            fi
            echo "  Execution Mode: $EXECUTION_MODE"
            PAYLOAD="{\"agent_id\":\"${AGENT_ID}\",\"frequency\":${FREQUENCY}"

            if [ -n "$SCENARIO_IDS" ]; then
              SCENARIOS_JSON=$(echo "$SCENARIO_IDS" | awk -F',' '{printf "["; for(i=1; i<=NF; i++) {gsub(/^[ \t]+|[ \t]+$/, "", $i); printf "%s", $i; if(i<NF) printf ","}; printf "]"}')
              PAYLOAD="${PAYLOAD},\"scenarios\":${SCENARIOS_JSON}"
              echo "  Scenario IDs: $SCENARIO_IDS"
            fi

            if [ -n "$TAGS" ]; then
              TAGS_JSON=$(echo "$TAGS" | awk -F',' '{printf "["; for(i=1; i<=NF; i++) {gsub(/^[ \t]+|[ \t]+$/, "", $i); printf "\"%s\"", $i; if(i<NF) printf ","}; printf "]"}')
              PAYLOAD="${PAYLOAD},\"tags\":${TAGS_JSON}"
              echo "  Tags: $TAGS"
            fi

            if [ -n "$PHONE_NUMBER" ]; then
              PAYLOAD="${PAYLOAD},\"outbound_phone_number\":\"${PHONE_NUMBER}\""
              echo "  Phone Number: $PHONE_NUMBER"
            fi

            if [ -n "$WEBSOCKET_URL" ]; then
              ESCAPED_WEBSOCKET_URL=$(printf '%s' "$WEBSOCKET_URL" | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip()))")
              PAYLOAD="${PAYLOAD},\"websocket_url\":${ESCAPED_WEBSOCKET_URL}"
              echo "  Websocket URL: $WEBSOCKET_URL"
            fi

            if [ -n "$NAME" ]; then
              ESCAPED_NAME=$(echo "$NAME" | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip()))")
              PAYLOAD="${PAYLOAD},\"name\":${ESCAPED_NAME}"
              echo "  Run Name: $NAME"
            fi

            PAYLOAD="${PAYLOAD}}"
            if [ "$EXECUTION_MODE" = "text" ]; then
              FULL_URL="${API_URL}/test_framework/v1/scenarios/run_scenarios_text/"
            else
              FULL_URL="${API_URL}/test_framework/v1/scenarios/run_scenarios/"
            fi
            ;;
          livekit_v2|pipecat_v2)
            if [ -n "$TAGS" ]; then
              echo "Error: tags are not supported for $EXECUTION_MODE. Use scenario_ids instead."
              exit 1
            fi
            if [ -n "$PHONE_NUMBER" ]; then
              echo "Error: phone_number is only valid for voice runs."
              exit 1
            fi
            if [ -z "$SCENARIO_IDS" ]; then
              echo "Error: scenario_ids is required for livekit_v2."
              exit 1
            fi

            if ! WEBRTC_SCENARIOS_JSON=$(printf '%s' "$SCENARIO_IDS" | python3 -c 'import json, sys; ids = [item.strip() for item in sys.stdin.read().split(",") if item.strip()]; assert ids and all(item.isdigit() for item in ids), "scenario_ids must contain numeric IDs"; print(json.dumps([{"scenario": int(item)} for item in ids], separators=(",", ":")))'); then
              echo "Error: scenario_ids must be a comma-separated list of numeric IDs."
              exit 1
            fi

            case "$EXECUTION_MODE" in
              livekit_v2)
                if [ -n "$PIPECAT_DATA" ]; then
                  echo "Error: pipecat_data is only valid for pipecat_v2 runs."
                  exit 1
                fi
                PROVIDER_DATA_NAME="livekit_data"
                PROVIDER_DATA="$LIVEKIT_DATA"
                FULL_URL="${API_URL}/test_framework/v1/scenarios-external/run_scenarios_livekit_v2/"
                ;;
              pipecat_v2)
                if [ -n "$LIVEKIT_DATA" ]; then
                  echo "Error: livekit_data is only valid for livekit_v2 runs."
                  exit 1
                fi
                PROVIDER_DATA_NAME="pipecat_data"
                PROVIDER_DATA="$PIPECAT_DATA"
                FULL_URL="${API_URL}/test_framework/v1/scenarios/run_scenarios_pipecat_v2/"
                ;;
            esac

            PAYLOAD="{\"agent\":\"${AGENT_ID}\",\"frequency\":${FREQUENCY},\"scenarios\":${WEBRTC_SCENARIOS_JSON}"
            if [ -n "$PROVIDER_DATA" ]; then
              if ! PROVIDER_DATA_JSON=$(printf '%s' "$PROVIDER_DATA" | python3 -c 'import json, sys; value = json.load(sys.stdin); assert isinstance(value, dict), "provider data must be a JSON object"; print(json.dumps(value, separators=(",", ":")))'); then
                echo "Error: ${PROVIDER_DATA_NAME} must be a JSON object."
                exit 1
              fi
              PAYLOAD="${PAYLOAD},\"${PROVIDER_DATA_NAME}\":${PROVIDER_DATA_JSON}"
            fi
            if [ -n "$NAME" ]; then
              ESCAPED_NAME=$(echo "$NAME" | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip()))")
              PAYLOAD="${PAYLOAD},\"name\":${ESCAPED_NAME}"
              echo "  Run Name: $NAME"
            fi

            PAYLOAD="${PAYLOAD}}"
            echo "  Execution Mode: $EXECUTION_MODE"
            echo "  Scenario IDs: $SCENARIO_IDS"
            ;;
          *)
            echo "Error: execution_mode must be voice, text, livekit_v2, or pipecat_v2."
            exit 1
            ;;
        esac

        echo ""
        echo "Starting test execution..."
        echo ""

        set +e
        # Bounded so a hung connection cannot hold off a cancellation forever.
        RESPONSE=$(curl --connect-timeout 10 --max-time 120 -s -w "\n%{http_code}" -X POST \
          "$FULL_URL" \
          -H "X-CEKURA-API-KEY: ${API_KEY}" \
          -H "Content-Type: application/json" \
          -d "${PAYLOAD}")
        CURL_EXIT_CODE=$?
        set -e

        if [ $CURL_EXIT_CODE -ne 0 ]; then
          echo "Error: Failed to connect to API (curl exit code: $CURL_EXIT_CODE)"
          exit 1
        fi

        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
          echo "Error: Failed to start test run (HTTP $HTTP_CODE)"
          echo ""
          echo "Response:"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          exit 1
        fi

        RESULT_ID=$(echo "$BODY" | python3 -c "import sys, json; data = json.load(sys.stdin); print(data.get('id', ''))")

        if [ -z "$RESULT_ID" ]; then
          echo "Error: No result ID returned from API"
          echo ""
          echo "Response:"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          exit 1
        fi

        echo "Test run initiated successfully"
        echo "  Result ID: $RESULT_ID"
        echo ""

        # Set this immediately so downstream steps can report the result even
        # if polling later times out or the runner stops unexpectedly.
        echo "result_id=${RESULT_ID}" >> "$GITHUB_OUTPUT"

        echo "Monitoring test execution..."
        echo ""
        START_TIME=$(date +%s)
        POLL_INTERVAL=30
        POLL_RETRY_INTERVAL=10
        MAX_POLL_ATTEMPTS=3
        POLL_FAILURES=0
        STATUS_RESPONSE_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/cekura-status.XXXXXX")

        while true; do
          CURRENT_TIME=$(date +%s)
          ELAPSED=$((CURRENT_TIME - START_TIME))

          if [ $ELAPSED -gt $TIMEOUT ]; then
            echo ""
            echo "Error: Test execution timeout after ${TIMEOUT} seconds"
            report_unfinished_result "❌ Test Execution Timed Out" true 15
            exit 1
          fi

          set +e
          run_interruptible curl --connect-timeout 5 --max-time 30 -sS -w "\n%{http_code}" -X GET \
            "${API_URL}/test_framework/v1/results/${RESULT_ID}/" \
            -H "X-CEKURA-API-KEY: ${API_KEY}" > "$STATUS_RESPONSE_FILE"
          STATUS_CURL_EXIT_CODE=$?
          set -e
          STATUS_RESPONSE=$(cat "$STATUS_RESPONSE_FILE")

          STATUS_HTTP_CODE=$(echo "$STATUS_RESPONSE" | tail -n1)
          STATUS_BODY=$(echo "$STATUS_RESPONSE" | sed '$d')

          if [ $STATUS_CURL_EXIT_CODE -ne 0 ] || [ "$STATUS_HTTP_CODE" != "200" ]; then
            POLL_FAILURES=$((POLL_FAILURES + 1))
            if [ $STATUS_CURL_EXIT_CODE -ne 0 ]; then
              POLL_ERROR="curl exit code: $STATUS_CURL_EXIT_CODE"
              POLL_RETRYABLE=true
            else
              POLL_ERROR="HTTP $STATUS_HTTP_CODE"
              case "$STATUS_HTTP_CODE" in
                408|429|5??) POLL_RETRYABLE=true ;;
                *) POLL_RETRYABLE=false ;;
              esac
            fi

            # Ride out transient network and server errors; auth and
            # not-found errors will not fix themselves.
            if [ "$POLL_RETRYABLE" = true ] && [ $POLL_FAILURES -lt $MAX_POLL_ATTEMPTS ]; then
              echo "  Warning: Failed to check test status ($POLL_ERROR), attempt ${POLL_FAILURES}/${MAX_POLL_ATTEMPTS}; retrying in ${POLL_RETRY_INTERVAL}s"
              run_interruptible sleep "$POLL_RETRY_INTERVAL" || true
              continue
            fi

            echo ""
            echo "Error: Failed to check test status ($POLL_ERROR)"
            echo ""
            echo "Response:"
            echo "$STATUS_BODY" | python3 -m json.tool 2>/dev/null || echo "$STATUS_BODY"
            exit 1
          fi

          POLL_FAILURES=0
          STATUS=$(echo "$STATUS_BODY" | python3 -c "import sys, json; data = json.load(sys.stdin); print(data.get('status', ''))")

          MINUTES=$((ELAPSED / 60))
          SECONDS=$((ELAPSED % 60))
          if [ $MINUTES -gt 0 ]; then
            TIME_STR="${MINUTES}m ${SECONDS}s"
          else
            TIME_STR="${SECONDS}s"
          fi

          echo "  [${TIME_STR}] Status: $STATUS"

          # Result statuses that end polling (backend TERMINAL_RESULT_STATUSES).
          case "$STATUS" in
            completed|failed|timeout|cancelled) ;;
            *) run_interruptible sleep "$POLL_INTERVAL" || true; continue ;;
          esac

          RESULT_IS_TERMINAL=true

          echo ""
          echo "=========================================="
          echo "Test execution finished: $STATUS"
          echo "=========================================="
          echo ""

          TOTAL_DURATION=$(echo "$STATUS_BODY" | python3 -c "import sys, json; data = json.load(sys.stdin); print(data.get('total_duration', 'N/A'))")
          TOTAL_RUNS=$(echo "$STATUS_BODY" | python3 -c "import sys, json; data = json.load(sys.stdin); print(data.get('total_runs_count', 0))")
          COMPLETED_RUNS=$(echo "$STATUS_BODY" | python3 -c "import sys, json; data = json.load(sys.stdin); print(data.get('completed_runs_count', 0))")
          SUCCESS_RUNS=$(echo "$STATUS_BODY" | python3 -c "import sys, json; data = json.load(sys.stdin); print(data.get('success_runs_count', 0))")
          SUCCESS_RATE=$(echo "$STATUS_BODY" | python3 -c "import sys, json; data = json.load(sys.stdin); print(f\"{data.get('success_rate', 0):.1f}\")")
          # The API's failed_runs_count counts only runs that completed and failed their checks;
          # runs that errored, timed out, or were cancelled are in neither count. Count from passes.
          NOT_PASSED_RUNS=$((TOTAL_RUNS - SUCCESS_RUNS))

          echo "Summary:"
          echo ""
          echo "  Total Duration: $TOTAL_DURATION"
          echo "  Total Runs: $TOTAL_RUNS"
          echo "  Completed: $COMPLETED_RUNS"
          echo "  Passed: $SUCCESS_RUNS"
          echo "  Did Not Pass: $NOT_PASSED_RUNS"
          echo "  Success Rate: ${SUCCESS_RATE}%"
          echo ""

          echo "Scenarios:"
          echo "$STATUS_BODY" | python3 -c "import sys, json; data = json.load(sys.stdin); [print(f\"  - {s.get('name', 'Unknown')} (ID: {s.get('id', 'N/A')})\") for s in data.get('scenarios', [])]"
          echo ""

          # A result turns terminal only once every run has ended, and is then `completed`
          # if any run completed — even if runs failed their checks or others errored.
          # So `completed` alone is not a pass: require every run to have passed.
          if [ "$STATUS" = "completed" ] && [ "$TOTAL_RUNS" -gt 0 ] && [ "$SUCCESS_RUNS" -eq "$TOTAL_RUNS" ]; then
            PASSED=true
            STATUS_MESSAGE="✅ All tests passed successfully"
            SUMMARY_STATUS="✅ All Tests Passed"
          else
            PASSED=false
            STATUS_MESSAGE="❌ Tests did not pass (status: $STATUS, ${NOT_PASSED_RUNS} of ${TOTAL_RUNS} runs did not pass)"
            SUMMARY_STATUS="❌ Tests Failed (status: $STATUS)"
          fi

          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$SUMMARY_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Summary:**" >> $GITHUB_STEP_SUMMARY
          echo "- Total Duration: $TOTAL_DURATION" >> $GITHUB_STEP_SUMMARY
          echo "- Total Runs: $TOTAL_RUNS" >> $GITHUB_STEP_SUMMARY
          echo "- Passed: $SUCCESS_RUNS" >> $GITHUB_STEP_SUMMARY
          echo "- Did Not Pass: $NOT_PASSED_RUNS" >> $GITHUB_STEP_SUMMARY
          echo "- Success Rate: ${SUCCESS_RATE}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          publish_result_link 15

          echo "$STATUS_MESSAGE"
          if [ "$PASSED" = true ]; then
            exit 0
          fi
          exit 1
        done

branding:
  icon: "play-circle"
  color: "blue"
